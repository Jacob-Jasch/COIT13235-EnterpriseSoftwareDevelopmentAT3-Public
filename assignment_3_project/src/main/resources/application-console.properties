# Console Profile Configuration
spring.application.name=assignment_3_project
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:h2:mem:chatdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.show-sql=false

# Disable web server for console mode
server.port=-1
spring.main.web-application-type=none

# Console mode settings
app.console.enabled=true
app.console.auto-start=true

# Logging for console mode
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN