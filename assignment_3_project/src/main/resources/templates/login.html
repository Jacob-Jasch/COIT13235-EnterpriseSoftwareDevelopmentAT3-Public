<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sign in to the music chat application" />
    <title>Sign in - Music Chat</title>

    <link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css" />
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1>Sign in</h1>
            <div th:if="${param.error}" class="error-alert">Invalid username or password.</div>
            <div th:if="${param.logout}" class="success-alert">You have been logged out successfully.</div>
            <div th:if="${success}" class="success-alert" th:text="${success}">Success message</div>
            <form th:action="@{/login}" method="post" class="login-form">
                <label for="username" class="muted">Username</label>
                <input id="username" name="username" required autofocus type="text" class="input" aria-label="Username" />
                <label for="password" class="muted">Password</label>
                <input id="password" name="password" type="password" required class="input" aria-label="Password" />
                <button type="submit">Sign in</button>
            </form>
            
            <div class="register-link">
                <p>Don't have an account? <a th:href="@{/register}">Register here</a></p>
            </div>
        </div>
    </div>
</body>
</html>
